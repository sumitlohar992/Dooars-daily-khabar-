<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)"/>
  
  <!-- Subtle circular radar / broadcast pulses for news alerts -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Mountain Silhouette (Dooars & Foothills) -->
  <path d="M110 320 L190 210 L250 280 L320 180 L410 320 Z" fill="#0c4a6e" opacity="0.6"/>
  <path d="M160 320 L230 230 L300 320 Z" fill="#0284c7" opacity="0.4"/>

  <!-- Stylized Open Newspaper / Book with Tea Leaf Monogram -->
  <path d="M150 240 C190 230, 240 245, 256 260 C272 245, 322 230, 362 240 C362 330, 322 340, 256 360 C190 340, 150 330, 150 240 Z" fill="#ffffff" filter="drop-shadow(0px 8px 16px rgba(15,23,42,0.4))"/>
  
  <!-- Center spine line -->
  <line x1="256" y1="260" x2="256" y2="358" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>

  <!-- Left page news lines -->
  <line x1="175" y1="265" x2="235" y2="265" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="175" y1="280" x2="230" y2="280" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="175" y1="295" x2="220" y2="295" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  <!-- Right page: Fresh Dooars two-leaf tea emblem & broadcast pulse -->
  <path d="M310 260 C330 265, 340 285, 335 305 C315 305, 300 285, 310 260 Z" fill="#0284c7"/>
  <path d="M290 280 C300 270, 320 275, 320 290 C305 295, 295 290, 290 280 Z" fill="#38bdf8"/>

  <!-- Modern broadcast / alert waves top right -->
  <path d="M340 160 C370 175, 395 200, 410 230" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round"/>
  <path d="M360 140 C400 160, 430 195, 445 235" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 8"/>
  <circle cx="330" cy="175" r="7" fill="#38bdf8"/>

  <!-- Brand Typography Badge 'DK' at bottom -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#f0f9ff" letter-spacing="4" text-anchor="middle">DOOARS KHABAR</text>
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#7dd3fc" letter-spacing="2" text-anchor="middle">AD-FREE • LOCAL • VERIFIED</text>
</svg>
